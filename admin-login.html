<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            background: #fff0e6;
            text-align: center;
            padding-top: 100px;
        }
        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin: 10px;
            width: 85%;
        }
        button {
            background: #ff6600;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <br>
    <button onclick="login()">Login</button>

    <p id="message"></p>
</div>

<script>
function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {
        window.location.href = "admin.html";
    } else {
        document.getElementById("message").innerText =
            "Invalid Username or Password";
    }
}
</script>

</body>
</html>
